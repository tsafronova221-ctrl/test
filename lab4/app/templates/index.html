{% extends "base.html" %}

{% block content %}
<div style="text-align: center; padding: 50px 20px;">
    <div style="font-size: 64px; margin-bottom: 30px; color: #00ff00;">🎮</div>
    <h2 style="font-family: 'Press Start 2P', cursive; font-size: 28px; color: #00ff00; margin-bottom: 30px;">
        ДОБРО ПОЖАЛОВАТЬ!
    </h2>
    <p style="font-size: 16px; margin-bottom: 40px; max-width: 700px; margin: 0 auto 40px;">
        УПРАВЛЯЙТЕ СВОЕЙ КОЛЛЕКЦИЕЙ ВИДЕОИГР. ТЕПЕРЬ С ПОСТОЯННЫМ ХРАНЕНИЕМ В БАЗЕ ДАННЫХ SQLite!
    </p>
    
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; margin: 50px 0;">
        <div class="stat-card">
            <div class="stat-number">📚</div>
            <div class="stat-label">КОЛЛЕКЦИЯ</div>
        </div>
        <div class="stat-card">
            <div class="stat-number">📦</div>
            <div class="stat-label">ИМПОРТ</div>
        </div>
        <div class="stat-card">
            <div class="stat-number">📊</div>
            <div class="stat-label">СТАТИСТИКА</div>
        </div>
    </div>
    
    <div style="margin-top: 40px;">
        <a href="{{ url_for('games_list') }}" class="btn" style="padding: 15px 40px; font-size: 16px;">
            📚 ПЕРЕЙТИ К БИБЛИОТЕКЕ
        </a>
    </div>
</div>

<style>
    .stat-card {
        background: rgba(0, 255, 0, 0.05);
        border: 2px solid #00ff00;
        border-radius: 10px;
        padding: 20px;
        text-align: center;
        transition: all 0.3s ease;
    }
    .stat-card:hover {
        transform: scale(1.05);
        box-shadow: 0 0 30px rgba(0, 255, 0, 0.4);
    }
    .stat-number {
        font-family: 'Press Start 2P', cursive;
        font-size: 32px;
        color: #00ff00;
        margin-bottom: 10px;
    }
    .stat-label {
        font-family: 'Press Start 2P', cursive;
        font-size: 12px;
        color: #ffffff;
    }
</style>
{% endblock %}
